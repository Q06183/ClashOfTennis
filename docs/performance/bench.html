<!doctype html><meta charset="utf-8"><title>网球渲染性能基准</title><style>body{margin:0}#court{position:fixed;inset:0}pre{position:fixed;top:0;left:0;pointer-events:none;background:#fff9;font:11px monospace;max-width:90%;white-space:pre-wrap}</style><div id="court"></div><pre id="metrics">正在加载两位角色…</pre><script type="module">
import {CourtView} from '/src/render/view.ts';import {Match} from '/src/simulation/match.ts';import {initPhysics} from '/src/simulation/physics.ts';import {driveAI} from '/src/simulation/ai.ts';
await initPhysics();const view=new CourtView(document.querySelector('#court'),()=>{});const quality=new URLSearchParams(location.search).get('quality')||'high';view.configureQuality(quality);view.renderer.setPixelRatio({high:1.8,balanced:1.25,low:1}[quality]);view.setMode('match',0);const match=new Match(['mei','leo']);let n=0,last=0,rows=[],warm=120;function frame(now){const start=performance.now();driveAI(match,0,'standard');driveAI(match,1,'standard');match.step(1/60);if(match.state.phase==='over'){match.state.phase='point';match.state.score=[0,0];match.state.pointTimer=0;}view.render(match.state,1/60);const work=performance.now()-start;const canvas=view.renderer.domElement;if(canvas.dataset.athlete0==='mei'&&canvas.dataset.athlete1==='leo'){if(warm>0)warm--;else{rows.push({interval:last?now-last:0,work,calls:view.renderer.info.render.calls,triangles:view.renderer.info.render.triangles,geometries:view.renderer.info.memory.geometries});n++;}}last=now;if(n<600)requestAnimationFrame(frame);else{const stats=key=>{const a=rows.map(r=>r[key]).sort((a,b)=>a-b);return {median:a[Math.floor(a.length*.5)],p95:a[Math.floor(a.length*.95)],max:a.at(-1)};};const data={frames:n,viewport:[innerWidth,innerHeight],quality,pixelRatio:view.renderer.getPixelRatio(),intervalMs:stats('interval'),cpuSubmissionMs:stats('work'),drawCalls:stats('calls'),triangles:stats('triangles'),geometries:stats('geometries'),over33ms:rows.filter(r=>r.interval>33).length,scope:'Desktop browser, fixed-step two-character AI rally; CPU submission is not GPU completion or real-phone FPS.'};document.querySelector('#metrics').textContent=JSON.stringify(data);document.body.dataset.complete='true';}}requestAnimationFrame(frame);
</script>
